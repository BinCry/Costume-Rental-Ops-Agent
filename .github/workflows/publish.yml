name: Build, Test, Publish Ops Agent Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: kietphan24/costume-rental-ops-agent
  STAGING_TAG: staging

permissions:
  contents: read

concurrency:
  group: ops-agent-staging-deploy
  cancel-in-progress: true

jobs:
  staging:
    name: Build, Test, Publish Ops Agent Image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AI_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci?sslmode=disable
      AI_INTERNAL_API_KEY: ci-only-internal-key-at-least-32-characters

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: '0.11.13'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Run verification suite
        run: |
          uv run ruff check .
          uv run mypy app scripts tests
          uv run python scripts/validate_knowledge_base.py
          uv run pytest -q
          uv build

      - name: Validate publish configuration
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          OPS_AGENT_COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.OPS_AGENT_COOLIFY_DEPLOY_WEBHOOK }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || (echo "Missing DOCKERHUB_USERNAME" && exit 1)
          test -n "$DOCKERHUB_TOKEN" || (echo "Missing DOCKERHUB_TOKEN" && exit 1)
          test -n "$OPS_AGENT_COOLIFY_DEPLOY_WEBHOOK" || (echo "Missing OPS_AGENT_COOLIFY_DEPLOY_WEBHOOK" && exit 1)

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push Ops Agent image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.STAGING_TAG }}
            ${{ env.IMAGE_NAME }}:staging-${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Coolify deploy
        env:
          OPS_AGENT_COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.OPS_AGENT_COOLIFY_DEPLOY_WEBHOOK }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          if [ -n "$COOLIFY_API_TOKEN" ]; then
            if curl --fail --show-error --silent --request POST \
              -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
              "$OPS_AGENT_COOLIFY_DEPLOY_WEBHOOK"; then
              exit 0
            fi
            echo "Bearer-authenticated webhook failed; retrying URL-authenticated webhook"
          fi
          curl --fail --show-error --silent --request POST \
            "$OPS_AGENT_COOLIFY_DEPLOY_WEBHOOK"

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ops-agent-verification-reports
          path: |
            .pytest_cache
            dist
          if-no-files-found: ignore
